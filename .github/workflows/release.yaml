name: Build and release static export

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static export
        run: bun run build

      - name: Compress dist folder
        run: zip -r dist.zip dist

      - name: Create Git tag
        id: tag
        run: |
          # 基于时间戳或版本号创建标签
          TAG_NAME="v$(date -u +%Y%m%d%H%M%S)"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          git tag $TAG_NAME
          git push origin $TAG_NAME

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist.zip
          tag_name: ${{ steps.tag.outputs.tag_name }}
          generate_release_notes: true

      - name: Keep only the five newest releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          mapfile -t releases < <(gh release list --repo "$GH_REPO" --limit 1000 --json tagName,createdAt --jq '[.[] | select(.tagName | test("^v[0-9]{14}$"))] | sort_by(.createdAt) | reverse | .[5:][] | .tagName')
          mapfile -t legacy < <(gh release list --repo "$GH_REPO" --limit 1000 --json tagName --jq '.[] | select(.tagName | test("^v[0-9]{14}$") | not) | .tagName')
          for tag in "${releases[@]}" "${legacy[@]}"; do
            [[ -n "$tag" ]] || continue
            gh release delete "$tag" --repo "$GH_REPO" --yes --cleanup-tag || true
          done
          mapfile -t tags < <(gh api --paginate "repos/${GH_REPO}/git/matching-refs/tags" --jq '.[].ref | select(test("^refs/tags/v[0-9]{14}$"))' | sort -r)
          mapfile -t legacy_tags < <(gh api --paginate "repos/${GH_REPO}/git/matching-refs/tags" --jq '.[].ref | select(test("^refs/tags/v[0-9]{14}$") | not)')
          for index in "${!tags[@]}"; do
            if (( index >= 5 )); then
              gh api --method DELETE "repos/${GH_REPO}/git/refs/${tags[$index]#refs/}"
            fi
          done
          for ref in "${legacy_tags[@]}"; do
            [[ -n "$ref" ]] || continue
            gh api --method DELETE "repos/${GH_REPO}/git/refs/${ref#refs/}"
          done

      - name: Keep only five workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          while true; do
            mapfile -t run_ids < <(gh api "repos/${GH_REPO}/actions/runs?per_page=100" \
              --jq ".workflow_runs | map(select(.id != ${GITHUB_RUN_ID} and .status == \"completed\")) | sort_by(.created_at) | reverse | .[4:][] | .id")
            if [[ "${#run_ids[@]}" -eq 0 ]]; then
              break
            fi
            for run_id in "${run_ids[@]}"; do
              gh api --method DELETE "repos/${GH_REPO}/actions/runs/${run_id}"
            done
          done
