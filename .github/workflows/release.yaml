name: Build and release static export

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install dependencies
        run: bun install

      - name: Build static export
        run: bun run build

      - name: Compress dist folder
        run: zip -r dist.zip dist

      - name: Create Git tag
        id: tag
        run: |
          # 基于时间戳或版本号创建标签
          TAG_NAME="v$(date -u +%Y%m%d%H%M%S)"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          git tag $TAG_NAME
          git push origin $TAG_NAME

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist.zip
          tag_name: ${{ steps.tag.outputs.tag_name }}
          generate_release_notes: true

      - name: Keep only the five newest releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          mapfile -t releases < <(gh release list --repo "$GH_REPO" --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[5:][] | .tagName')
          for tag in "${releases[@]}"; do
            gh release delete "$tag" --repo "$GH_REPO" --yes --cleanup-tag || true
          done
          mapfile -t tags < <(gh api "repos/${GH_REPO}/git/matching-refs/tags/v" --jq '.[].ref | select(test("^refs/tags/v[0-9]{14}$"))' | sort -r)
          for index in "${!tags[@]}"; do
            if (( index >= 5 )); then
              gh api --method DELETE "repos/${GH_REPO}/git/refs/${tags[$index]#refs/}"
            fi
          done
